; TLS for the ratel dashboard with the Tailscale certificate, run by its own
; supervised service (contrib/ratel-tls.initd), separate from any other stunnel.
; Install as /etc/stunnel/ratel-web.conf. Reachable only on the tailnet address
; (tailscale0 is accepted by the homelab firewall; nothing to open).
foreground = yes
setuid   = stunnel
setgid   = stunnel
; no pid file: supervise-daemon tracks the process
pid      =
socket   = l:TCP_NODELAY=1

[ratel-web]
accept   = 100.x.y.z:8448          ; this server's Tailscale IPv4 (tailscale ip -4)
; a UNIX socket in a directory only ratel-web and stunnel can enter: nothing else can
; pose as the dashboard and collect the token
connect  = /run/ratel-web/web.sock
; pass the real client address (audit log, ack attribution)
protocol = proxy
; the key is read as root at start, before stunnel drops to the stunnel user
cert     = /opt/tailscale/certs/homelab.crt
key      = /opt/tailscale/certs/homelab.key
sslVersionMin = TLSv1.2
