; TLS for the ratel dashboard with the Tailscale certificate (same pattern as the
; other homelab services). Reachable only on the tailnet address.
; Add to the stunnel configuration, then open 8448 on the tailscale0 interface only
; in the homelab firewall script.
[ratel-web]
accept   = 100.x.y.z:8448          ; this server's Tailscale IPv4 (tailscale ip -4)
; a UNIX socket in a directory only ratel-web and stunnel can enter: nothing else can
; pose as the dashboard and collect the token
connect  = /run/ratel-web/web.sock
; pass the real client address (audit log, ack attribution)
protocol = proxy
cert     = /opt/tailscale/certs/homelab.tailnet.ts.net.crt
key      = /opt/tailscale/certs/homelab.tailnet.ts.net.key
sslVersionMin = TLSv1.2
