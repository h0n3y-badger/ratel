# /etc/ratel/watch.conf: one option per line, same names as `ratel watch --help`.
# Lines are "key = value"; flags are just "key".

# Learn what's normal for this long before novelty rules apply (new destinations,
# above-baseline uploads, servers suddenly connecting out). Baselines persist in
# /var/lib/ratel, so this only matters on the very first start.
learn-hours = 24

# Lowest severity that goes to XMPP (via /run/prosody/notify.sock).
# Everything, including "low", is still written to /var/log/ratel/alerts.jsonl.
notify-min = medium

# Seconds between socket dumps (byte counters). Closed sockets are reported by
# the kernel immediately anyway.
interval = 2

# Same alert again after this many hours (sooner if it gets worse).
cooldown = 6

# Periodic static scans: alert once per file version on `high` binaries and on
# package files modified after installation (every file is hashed and checked
# against the apk database, so replaced system binaries are caught too).
scan-path = /bin
scan-path = /sbin
scan-path = /usr/bin
scan-path = /usr/sbin
scan-path = /usr/local
scan-path = /opt
scan-path = /tmp
scan-path = /var/tmp
scan-path = /dev/shm
scan-every = 6

# Things you know are fine. Entities are executable paths, with " (uid N)" appended for
# non-root users, "[/full/script/path]" for interpreters, "ctr:<id>:<path>" for
# containers and "uid:<n>:<comm>" when the process can't be read; end with * to match
# a prefix (e.g. "/usr/bin/restic*" covers every user).
# ignore = /usr/bin/restic
# ignore-dest = 192.0.2.25
#
# Extra DNS servers whose answers are believed (besides /etc/resolv.conf and the
# big public resolvers). Answers from any other server carry no names.
# resolver = 192.0.2.53

# Known-malware signatures (ClamAV databases kept current by freshclam; used when the
# directory exists) and the automatic response to a signature match:
# clamav-db = /var/lib/clamav
# quarantine = suspicious    (off | signatures: files matching a ClamAV signature |
#                             suspicious: also executables in /tmp, /var/tmp, /dev/shm
#                             with 2+ evasion capabilities at >= 0.85; moved into
#                             /var/lib/ratel/quarantine, never package-owned ones)
# contain = signatures       (off | signatures: freeze processes running a matching or
#                             obviously bad file | high: also processes behind high
#                             behaviour alerts)
# A mode chosen in the dashboard (Response page) overrides these until changed again.
# contain-never = /usr/local/bin/my-critical-daemon
